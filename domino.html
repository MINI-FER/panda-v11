<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominó Temático Premium: Discurso Colectivo</title>
    <style>
        :root {
            --bg-color: #12121e; /* Fondo ligeramente más oscuro */
            --accent-color: #4da6ff;
            --success-color: #27ae60;
            --error-color: #ff4d4d;
            
            /* Nuevas definiciones de colores con profundidad */
            --tile-bg-facade: rgba(255,255,255,0.05);
            --color-1-grad: linear-gradient(135deg, #3498db, #2980b9);
            --color-2-grad: linear-gradient(135deg, #9b59b6, #8e44ad);
            --color-3-grad: linear-gradient(135deg, #e67e22, #d35400);
            --color-4-grad: linear-gradient(135deg, #f1c40f, #f39c12);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: white;
            overflow-x: hidden;
        }

        /* --- PANTALLA DE MENÚ (Sin cambios estructurales) --- */
        .overlay-menu {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a1a2e 0%, #10101a 100%);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .contenido-menu {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .selector-dificultad {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 25px 0;
        }

        .btn-dif {
            padding: 12px 24px;
            border: 2px solid var(--accent-color);
            background: transparent;
            color: white;
            border-radius: 30px; /* Bordes más redondeados */
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-dif:hover, .btn-dif.seleccionado {
            background: var(--accent-color);
            box-shadow: 0 0 20px rgba(77, 166, 255, 0.5);
        }

        .boton-jugar {
            padding: 15px 50px;
            font-size: 1.2rem;
            background: var(--success-color);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .boton-jugar:hover { transform: scale(1.05); background: #2ecc71; box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4); }

        /* --- INTERFAZ DE JUEGO (Sin cambios estructurales) --- */
        #contenedor-juego {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        #mensaje {
            height: 35px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--accent-color);
            font-size: 1.1rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        #tablero {
            /* Ajustes estructurales respetados y la alineación vertical con la altura mínima */
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 15px;
            min-height: 90px;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            border: 2px dashed rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }

        /* =========================================
           NUEVO DISEÑO PREMIUM DE FICHAS (TÁCTIL)
           ========================================= */
        
        /* Contenedor base de la ficha (Común) */
        .ficha-base {
            display: flex;
            border-radius: 12px; /* Esquinas suavizadas */
            overflow: hidden;
            position: relative; /* Para el divisor central */
            box-sizing: border-box;
            
            /* Efecto de grosor y biselado (esqueumorfismo sutil) */
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 6px 12px rgba(0,0,0,0.5), /* Sombra proyectada */
                inset 0 1px 1px rgba(255,255,255,0.1); /* Brillo en borde superior */
        }

        /* Ranura central realista */
        .ficha-base::after {
            content: "";
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 80%;
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 
                -1px 0 0 rgba(255,255,255,0.05),
                1px 0 0 rgba(255,255,255,0.05);
            z-index: 2;
        }

        /* Estilos específicos para Fichas del Tablero */
        .ficha-tablero {
            composes: ficha-base;
            display: flex; /* Reset composes if needed, standardizing on flex */
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 6px 12px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1);
            
            width: 170px; /* Ligeramente más grande */
            height: 85px;
        }

        /* Estilos específicos para Fichas de la Mano */
        .ficha-mano {
            composes: ficha-base;
            display: flex; /* Reset composes if needed, standardizing on flex */
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 6px 12px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1);

            width: 160px;
            height: 80px;
            cursor: grab;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .ficha-mano:active { cursor: grabbing; }

        /* Efecto de elevación e iluminación al hacer hover en la mano */
        .ficha-mano:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 
                0 15px 25px rgba(0,0,0,0.6), 
                0 0 15px rgba(77, 166, 255, 0.3);
            filter: brightness(1.1);
        }

        /* Diseño de los lados de la ficha */
        .lado {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            text-align: center;
            position: relative;
            
            /* Efecto de profundidad interna */
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
        }

        /* Brillo sutil de superficie pulida */
        .lado::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.05), transparent);
            border-radius: 12px 12px 0 0;
            z-index: 1;
        }

        /* Estilos de Texto dentro de la ficha */
        .lado span {
            position: relative; z-index: 2; /* Por encima del brillo */
        }

        .txt-tema {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .numero {
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: 6px;
            opacity: 0.9;
            font-family: 'Courier New', Courier, monospace; /* Fuente técnica para números */
            background: rgba(0,0,0,0.2);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .lado-der { border-left: none; /* Quitamos el borde antiguo */ }

        /* =========================================
           /* =========================================
           PALETA DE COLORES PROFUNDA (GRADIANTES)
           ========================================= */
        .color-1 { background: var(--color-1-grad); }
        .color-2 { background: var(--color-2-grad); }
        .color-3 { background: var(--color-3-grad); }
        
        /* Color 4 (Amarillo) con contraste especial */
        .color-4 { 
            background: var(--color-4-grad); 
            color: #2c3e50; /* Texto oscuro para contraste */
        }
        .color-4 .numero { background: rgba(0,0,0,0.1); color: #2c3e50; }
        .color-4 .txt-tema { text-shadow: 0 1px 1px rgba(255,255,255,0.3); }

        /* ZONA DE MANO (Sin cambios estructurales) */
        .zona-mano {
            margin-top: 40px;
            padding: 25px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.3);
        }

        #mano-fichas {
            display: flex;
            gap: 20px;
            justify-content: center;
            padding: 15px;
        }
    </style>
</head>
<body>

    <div id="pantalla-inicio" class="overlay-menu">
        <div class="contenido-menu">
            <h1>DOMINÓ HUMANIDADES</h1>
            <p>Construye el discurso colectivo conectando ideas.</p>
            
            <div class="selector-dificultad">
                <button onclick="seleccionarDificultad('facil', this)" class="btn-dif">FÁCIL</button>
                <button onclick="seleccionarDificultad('medio', this)" class="btn-dif">MEDIO</button>
                <button onclick="seleccionarDificultad('dificil', this)" class="btn-dif">DIFÍCIL</button>
            </div>

            <button id="btn-iniciar" onclick="iniciarJuego()" class="boton-jugar" style="display:none;">
                INICIAR PARTIDA
            </button>
        </div>
    </div>

    <div id="contenedor-juego" style="display: none;">
        <div id="mensaje">Selecciona una dificultad y comienza a conectar</div>
        
        <div id="tablero" ondragover="permitirSoltar(event)" ondrop="soltarFicha(event)">
            <div class="ficha-tablero">
                <div class="lado color-1">
                    <span class="txt-tema">Inicio</span>
                    <span class="numero">[1]</span>
                </div>
                <div class="lado lado-der color-4">
                    <span class="txt-tema">Meta</span>
                    <span class="numero"></span>
                </div>
            </div>
        </div>

        <div class="zona-mano">
            <h3 style="text-align: center; margin-top: 0; color: #aaa; text-transform: uppercase; letter-spacing: 2px;">Tu Mano de Ideas</h3>
            <div id="mano-fichas">
                <div id="f1" class="ficha-mano" draggable="true" ondragstart="arrastrarFicha(event)" data-izq="4" data-der="2" data-txt-izq="Meta" data-txt-der="Redes">
                    <div class="lado color-4"><span class="txt-tema">Meta</span><span class="numero"></span></div>
                    <div class="lado lado-der color-2"><span class="txt-tema">Redes</span><span class="numero"></span></div>
                </div>
                <div id="f2" class="ficha-mano" draggable="true" ondragstart="arrastrarFicha(event)" data-izq="2" data-der="3" data-txt-izq="Redes" data-txt-der="Cultura">
                    <div class="lado color-2"><span class="txt-tema">Redes</span><span class="numero"></span></div>
                    <div class="lado lado-der color-3"><span class="txt-tema">Cultura</span><span class="numero"></span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let extremoIzquierdo = 1;
        let extremoDerecho = 4;
        let dificultad = "";

        function seleccionarDificultad(nivel, elemento) {
            dificultad = nivel;
            document.querySelectorAll('.btn-dif').forEach(btn => btn.classList.remove('seleccionado'));
            elemento.classList.add('seleccionado');
            document.getElementById("btn-iniciar").style.display = "inline-block";
        }

        function iniciarJuego() {
            document.getElementById("pantalla-inicio").style.opacity = "0";
            setTimeout(() => {
                document.getElementById("pantalla-inicio").style.display = "none";
                document.getElementById("contenedor-juego").style.display = "block";
                if(dificultad === 'dificil') {
                    document.getElementById("mensaje").innerText = "Modo Difícil: ¡Conexiones sin pistas!";
                }
            }, 500);
        }

        function permitirSoltar(event) {
            event.preventDefault();
        }

        function arrastrarFicha(event) {
            event.dataTransfer.setData("text/plain", event.target.id);
            document.getElementById("mensaje").style.color = "#4da6ff";
            document.getElementById("mensaje").innerText = "Buscando dónde conectar...";
        }

        function soltarFicha(event) {
            event.preventDefault();
            const idFicha = event.dataTransfer.getData("text/plain");
            const fichaElemento = document.getElementById(idFicha);
            
            if (!fichaElemento) return;

            const valIzq = parseInt(fichaElemento.getAttribute("data-izq"));
            const valDer = parseInt(fichaElemento.getAttribute("data-der"));
            const txtIzq = fichaElemento.getAttribute("data-txt-izq");
            const txtDer = fichaElemento.getAttribute("data-txt-der");

            const msgDiv = document.getElementById("mensaje");

            // Lógica del Árbitro Digital para el extremo derecho
            if (valIzq === extremoDerecho) {
                crearFichaEnTablero(valIzq, valDer, txtIzq, txtDer);
                extremoDerecho = valDer;
                fichaElemento.remove();
                msgDiv.style.color = "#27ae60";
                msgDiv.innerText = "¡Conexión correcta!";
            } 
            else if (valDer === extremoDerecho) {
                // Rotar la ficha lógicamente creando la nueva al revés
                crearFichaEnTablero(valDer, valIzq, txtDer, txtIzq);
                extremoDerecho = valIzq;
                fichaElemento.remove();
                msgDiv.style.color = "#27ae60";
                msgDiv.innerText = "¡Conexión correcta!";
            }
            else {
                msgDiv.style.color = "#ff4d4d";
                msgDiv.innerText = "Movimiento inválido. Los temas no coinciden.";
            }
        }

        // Función actualizada para generar la estructura Premium dinámicamente
        function crearFichaEnTablero(izq, der, txtI, txtD) {
            const tablero = document.getElementById("tablero");
            const nuevaFicha = document.createElement("div");
            nuevaFicha.className = "ficha-tablero";
            
            // Generar estructura Premium respetando el color 4 oscuro
            nuevaFicha.innerHTML = `
                <div class="lado color-${izq}">
                    <span class="txt-tema">${txtI}</span>
                    <span class="numero">[${izq}]</span>
                </div>
                <div class="lado lado-der color-${der}">
                    <span class="txt-tema">${txtD}</span>
                    <span class="numero">[${der}]</span>
                </div>
            `;
            
            tablero.appendChild(nuevaFicha);
        }
    </script>
</body>
</html>
