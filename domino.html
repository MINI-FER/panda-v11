<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominó Temático: Discurso Colectivo</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --accent-color: #4da6ff;
            --success-color: #27ae60;
            --error-color: #ff4d4d;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: white;
            overflow-x: hidden;
        }

        /* --- PANTALLA DE MENÚ --- */
        .overlay-menu {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a1a2e 0%, #16213e 100%);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .contenido-menu {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .selector-dificultad {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 25px 0;
        }

        .btn-dif {
            padding: 10px 20px;
            border: 2px solid var(--accent-color);
            background: transparent;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        .btn-dif:hover, .btn-dif.seleccionado {
            background: var(--accent-color);
            box-shadow: 0 0 15px rgba(77, 166, 255, 0.4);
        }

        .boton-jugar {
            padding: 15px 45px;
            font-size: 1.2rem;
            background: var(--success-color);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, background 0.2s;
        }

        .boton-jugar:hover { transform: scale(1.05); background: #2ecc71; }

        /* --- INTERFAZ DE JUEGO --- */
        #contenedor-juego {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        #mensaje {
            height: 30px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        /* Ajustes estructurales según las fuentes [1] */
        #tablero {
            display: flex;
            gap: 20px;            /* Espaciado uniforme entre fichas [1] */
            flex-wrap: wrap;      /* Crecimiento fluido del tablero [1] */
            margin-top: 15px;     /* Separación superior [1] */
            min-height: 90px;     /* Estabilidad visual del área [1] */
            align-items: center;  /* Alineación vertical perfecta de fichas [1] */
            justify-content: center;
            padding: 30px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            border: 2px dashed rgba(255, 255, 255, 0.1);
        }

        /* --- FICHAS --- */
        .ficha-tablero, .ficha-mano {
            display: flex;
            width: 160px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            cursor: grab;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .ficha-tablero:hover { transform: scale(1.02); }

        .lado {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 5px;
            font-size: 0.8rem;
            text-align: center;
            position: relative;
        }

        .numero {
            font-weight: bold;
            font-size: 1rem;
            margin-top: 5px;
            opacity: 0.8;
        }

        .lado-der { border-left: 1px solid rgba(0,0,0,0.2); }

        /* Colores temáticos */
        .color-1 { background-color: #3498db; }
        .color-2 { background-color: #9b59b6; }
        .color-3 { background-color: #e67e22; }
        .color-4 { background-color: #f1c40f; color: #333; }

        .zona-mano {
            margin-top: 40px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
        }

        #mano-fichas {
            display: flex;
            gap: 15px;
            justify-content: center;
            padding: 10px;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Inicio -->
    <div id="pantalla-inicio" class="overlay-menu">
        <div class="contenido-menu">
            <h1>DOMINÓ TEMÁTICO</h1>
            <p>Construye el discurso colectivo conectando ideas.</p>
            
            <div class="selector-dificultad">
                <button onclick="seleccionarDificultad('facil', this)" class="btn-dif">FÁCIL</button>
                <button onclick="seleccionarDificultad('medio', this)" class="btn-dif">MEDIO</button>
                <button onclick="seleccionarDificultad('dificil', this)" class="btn-dif">DIFÍCIL</button>
            </div>

            <button id="btn-iniciar" onclick="iniciarJuego()" class="boton-jugar" style="display:none;">
                INICIAR PARTIDA
            </button>
        </div>
    </div>

    <!-- Contenedor del Juego -->
    <div id="contenedor-juego" style="display: none;">
        <div id="mensaje">Selecciona una dificultad y comienza a conectar</div>
        
        <div id="tablero" ondragover="permitirSoltar(event)" ondrop="soltarFicha(event)">
            <!-- Ficha inicial fija -->
            <div class="ficha-tablero">
                <div class="lado color-1">
                    <span>Inicio</span>
                    <span class="numero">[1]</span>
                </div>
                <div class="lado lado-der color-4">
                    <span>Meta</span>
                    <span class="numero"></span>
                </div>
            </div>
        </div>

        <div class="zona-mano">
            <h3 style="text-align: center;">Tu Mano de Ideas</h3>
            <div id="mano-fichas">
                <!-- Fichas de ejemplo -->
                <div id="f1" class="ficha-mano" draggable="true" ondragstart="arrastrarFicha(event)" data-izq="4" data-der="2" data-txt-izq="Meta" data-txt-der="Redes">
                    <div class="lado color-4"><span>Meta</span><span class="numero"></span></div>
                    <div class="lado lado-der color-2"><span>Redes</span><span class="numero"></span></div>
                </div>
                <div id="f2" class="ficha-mano" draggable="true" ondragstart="arrastrarFicha(event)" data-izq="2" data-der="3" data-txt-izq="Redes" data-txt-der="Cultura">
                    <div class="lado color-2"><span>Redes</span><span class="numero"></span></div>
                    <div class="lado lado-der color-3"><span>Cultura</span><span class="numero"></span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let extremoIzquierdo = 1;
        let extremoDerecho = 4;
        let dificultad = "";

        function seleccionarDificultad(nivel, elemento) {
            dificultad = nivel;
            document.querySelectorAll('.btn-dif').forEach(btn => btn.classList.remove('seleccionado'));
            elemento.classList.add('seleccionado');
            document.getElementById("btn-iniciar").style.display = "inline-block";
        }

        function iniciarJuego() {
            document.getElementById("pantalla-inicio").style.opacity = "0";
            setTimeout(() => {
                document.getElementById("pantalla-inicio").style.display = "none";
                document.getElementById("contenedor-juego").style.display = "block";
                if(dificultad === 'dificil') {
                    document.getElementById("mensaje").innerText = "Modo Difícil: ¡Conexiones sin pistas!";
                }
            }, 500);
        }

        function permitirSoltar(event) {
            event.preventDefault();
        }

        function arrastrarFicha(event) {
            event.dataTransfer.setData("text/plain", event.target.id);
            document.getElementById("mensaje").style.color = "#4da6ff";
            document.getElementById("mensaje").innerText = "Buscando dónde conectar...";
        }

        function soltarFicha(event) {
            event.preventDefault();
            const idFicha = event.dataTransfer.getData("text/plain");
            const fichaElemento = document.getElementById(idFicha);
            
            if (!fichaElemento) return;

            const valIzq = parseInt(fichaElemento.getAttribute("data-izq"));
            const valDer = parseInt(fichaElemento.getAttribute("data-der"));
            const txtIzq = fichaElemento.getAttribute("data-txt-izq");
            const txtDer = fichaElemento.getAttribute("data-txt-der");

            const msgDiv = document.getElementById("mensaje");

            // Lógica del Árbitro Digital para el extremo derecho
            if (valIzq === extremoDerecho) {
                crearFichaEnTablero(valIzq, valDer, txtIzq, txtDer);
                extremoDerecho = valDer;
                fichaElemento.remove();
                msgDiv.style.color = "#27ae60";
                msgDiv.innerText = "¡Conexión correcta!";
            } 
            else if (valDer === extremoDerecho) {
                crearFichaEnTablero(valDer, valIzq, txtDer, txtIzq);
                extremoDerecho = valIzq;
                fichaElemento.remove();
                msgDiv.style.color = "#27ae60";
                msgDiv.innerText = "¡Conexión correcta!";
            }
            else {
                msgDiv.style.color = "#ff4d4d";
                msgDiv.innerText = "Movimiento inválido. Los temas no coinciden.";
            }
        }

        function crearFichaEnTablero(izq, der, txtI, txtD) {
            const tablero = document.getElementById("tablero");
            const nuevaFicha = document.createElement("div");
            nuevaFicha.className = "ficha-tablero";
            
            nuevaFicha.innerHTML = `
                <div class="lado color-${izq}">
                    <span>${txtI}</span>
                    <span class="numero">[${izq}]</span>
                </div>
                <div class="lado lado-der color-${der}">
                    <span>${txtD}</span>
                    <span class="numero">[${der}]</span>
                </div>
            `;
            
            tablero.appendChild(nuevaFicha);
        }
    </script>
</body>
</html>
