<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominó Digital Interactivo - Humanidades 2</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        h1 {
            color: #4da6ff;
            margin-bottom: 5px;
            text-align: center;
        }

        .sub {
            color: #aaa;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Indicador de estado o alertas */
        #mensaje {
            height: 25px;
            color: #ff4d4d;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }

        /* TABLERO DE JUEGO */
        .tablero-contenedor {
            width: 90%;
            max-width: 900px;
            background-color: #2a2a35;
            border: 2px dashed #4da6ff;
            border-radius: 10px;
            min-height: 180px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            overflow-x: auto;
        }

        /* ESTILO DE LAS FICHAS GRANDES (En el tablero) */
        .ficha-tablero {
            display: flex;
            width: 200px;
            height: 100px;
            border: 3px solid #000;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .lado {
            flex: 1;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 10px;
            font-weight: bold;
            color: #fff;
        }

        .lado-der {
            border-left: 2px solid #000;
        }

        .numero {
            font-size: 13px;
            align-self: flex-end;
            background: rgba(0,0,0,0.3);
            padding: 1px 5px;
            border-radius: 3px;
        }

        /* MANO DEL JUGADOR */
        .mano-jugador {
            width: 90%;
            max-width: 900px;
            background-color: #23232e;
            border-top: 4px solid #8e44ad;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .mis-fichas {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 15px;
            min-height: 90px;
            align-items: center;
        }

        /* FICHAS EN LA MANO (Arrastrables) */
        .ficha-mano {
            display: flex;
            width: 140px;
            height: 70px;
            border: 2px solid #000;
            border-radius: 6px;
            overflow: hidden;
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
        }

        .ficha-mano:active {
            cursor: grabbing;
        }

        .ficha-mano:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .lado-mini {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            padding: 4px;
            text-align: center;
        }

        /* COLORES ASIGNADOS POR TEMA */
        .color-1 { background-color: #d9383a; } /* Rojo: Racismo */
        .color-3 { background-color: #27ae60; } /* Verde: Hermenéutica */
        .color-4 { background-color: #f1c40f; color: #000; } /* Amarillo: Parresía */
        .color-6 { background-color: #8e44ad; } /* Morado: Prospectiva */
    </style>
</head>
<body>

    <h1>DOMINÓ DIGITAL INTERACTIVO</h1>
    <div class="sub">Módulo 3: La experiencia de sí mismo en el discurso colectivo</div>
    
    <!-- Mensajes del árbitro virtual -->
    <div id="mensaje">Arrastra una ficha de tu mano y suéltala en el tablero</div>

    <!-- TABLERO DE JUEGO (ZONA DE SOLTAR) -->
    <h3>Mesa de Juego</h3>
    <div class="tablero-contenedor" id="tablero" ondragover="permitirSoltar(event)" ondrop="soltarFicha(event)">
        <!-- La ficha inicial ya puesta en el tablero -->
        <div class="ficha-tablero">
            <div class="lado color-1">
                <span>Racismo sutil en el lenguaje.</span>
                <span class="numero">[1]</span>
            </div>
            <div class="lado lado-der color-4">
                <span>Parresía: Hablar con la verdad.</span>
                <span class="numero">[4]</span>
            </div>
        </div>
    </div>

    <!-- MANO DEL JUGADOR -->
    <div class="mano-jugador">
        <h3>Tu Mano (Fichas Disponibles para Arrastrar)</h3>
        <div class="mis-fichas" id="mano">
            
            <!-- Ficha 1 (Combina con el 4) -->
            <div class="ficha-mano" id="fichaA" draggable="true" ondragstart="arrastrarFicha(event)" data-izq="4" data-der="6" data-txt-izq="Decir la verdad de frente." data-txt-der="Prospectiva: Futuro común.">
                <div class="lado-mini color-4">4</div>
                <div class="lado-mini color-6" style="border-left: 1px solid #000;">6</div>
            </div>

            <!-- Ficha 2 (No combina con los extremos actuales) -->
            <div class="ficha-mano" id="fichaB" draggable="true" ondragstart="arrastrarFicha(event)" data-izq="3" data-der="3" data-txt-izq="Hermenéutica del sujeto." data-txt-der="Auto-examen consciente.">
                <div class="lado-mini color-3">3</div>
                <div class="lado-mini color-3" style="border-left: 1px solid #000;">3</div>
            </div>

        </div>
    </div>

    <script>
        // Lógica del juego: extremos actuales del tablero
        // Al inicio, la ficha del tablero tiene un [1] a la izquierda y un [4] a la derecha
        let extremoIzquierdo = 1;
        let extremoDerecho = 4;

        function permitirSoltar(event) {
            event.preventDefault(); // Necesario para permitir soltar elementos
        }

        function arrastrarFicha(event) {
            // Guardamos el ID de la ficha que se está moviendo
            event.dataTransfer.setData("text/plain", event.target.id);
            document.getElementById("mensaje").style.color = "#4da6ff";
            document.getElementById("mensaje").innerText = "Buscando dónde conectar...";
        }

        function soltarFicha(event) {
            event.preventDefault();
            const idFicha = event.dataTransfer.getData("text/plain");
            const fichaElemento = document.getElementById(idFicha);
            
            if (!fichaElemento) return;

            // Extraemos los valores numéricos guardados en los atributos "data-" de la ficha
            const valIzq = parseInt(fichaElemento.getAttribute("data-izq"));
            const valDer = parseInt(fichaElemento.getAttribute("data-der"));
            const txtIzq = fichaElemento.getAttribute("data-txt-izq");
            const txtDer = fichaElemento.getAttribute("data-txt-der");

            const msgDiv = document.getElementById("mensaje");

            // EL ÁRBITRO DIGITAL: Validamos si conecta por el extremo derecho
            if (valIzq === extremoDerecho) {
                // Crea la ficha en formato grande para el tablero
                crearFichaEnTablero(valIzq, valDer, txtIzq, txtDer, false);
                extremoDerecho = valDer; // Actualiza el nuevo extremo derecho
                fichaElemento.remove();   // Quita la ficha de la mano
                msgDiv.style.color = "#27ae60";
                msgDiv.innerText = "¡Conexión correcta! El discurso colectivo avanza.";
            } 
            // Validamos si conecta de forma invertida por el extremo derecho
            else if (valDer === extremoDerecho) {
                crearFichaEnTablero(valDer, valIzq, txtDer, txtIzq, false);
                extremoDerecho = valIzq;
                fichaElemento.remove();
                msgDiv.style.color = "#27ae60";
                msgDiv.innerText = "¡Conexión correcta! El discurso colectivo avanza.";
            }
            // Si no coincide con las reglas
            else {
                msgDiv.style.color = "#ff4d4d";
                msgDiv.innerText = "Movimiento inválido. Los temas o números no coinciden.";
            }
        }

        // Función auxiliar que dibuja la ficha grande dinámicamente en la mesa
        function crearFichaEnTablero(izq, der, txtI, txtD, alInicio) {
            const tablero = document.getElementById("tablero");
            
            const nuevaFicha = document.createElement("div");
            nuevaFicha.className = "ficha-tablero";
            
            nuevaFicha.innerHTML = `
                <div class="lado color-${izq}">
                    <span>${txtI}</span>
                    <span class="numero">[${izq}]</span>
                </div>
                <div class="lado lado-der color-${der}">
                    <span>${txtD}</span>
                    <span class="numero">[${der}]</span>
                </div>
            `;
            
            tablero.appendChild(nuevaFicha);
        }
    </script>
</body>
</html>
